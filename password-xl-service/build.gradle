plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.graalvm.buildtools.native' version '1.1.11'
    id 'com.google.cloud.tools.jib' version '3.5.4'
}

group = 'com'
version = providers.gradleProperty('releaseVersion').getOrElse('1.1.0')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

jib {
    from {
        image = providers.environmentVariable('JVM_BASE_IMAGE').getOrElse('eclipse-temurin:25-jre-alpine')
        def baseUser = providers.environmentVariable('JVM_BASE_USERNAME')
        def basePassword = providers.environmentVariable('JVM_BASE_PASSWORD')
        if (!providers.environmentVariable('JVM_BASE_IMAGE').isPresent()) {
            baseUser = baseUser.orElse(providers.environmentVariable('REGISTRY_DOCKERHUB_USERNAME'))
            basePassword = basePassword.orElse(providers.environmentVariable('REGISTRY_DOCKERHUB_PASSWORD'))
        }
        if (baseUser.isPresent() && basePassword.isPresent()) {
            auth { username = baseUser.get(); password = basePassword.get() }
        }
        platforms {
            platform {
                architecture = providers.gradleProperty('targetArch').getOrElse('amd64')
                os = 'linux'
            }
        }
    }
    to { image = 'password-xl-service-jvm:' + version }
    container {
        ports = ['8080']
        environment = [DATA_DIR: '/password-xl-service', TZ: 'Asia/Shanghai']
        labels = ['org.opencontainers.image.version': version.toString(),
                  'org.opencontainers.image.revision': providers.environmentVariable('RELEASE_SOURCE_SHA').getOrElse('local')]
    }
    outputPaths {
        tar = file(providers.gradleProperty('jibTarPath').getOrElse("${layout.buildDirectory.get()}/jib-image.tar"))
    }
}

// CI supplies the frontend built from the pinned release commit. Local builds retain the
// existing static resources unless frontendDist is explicitly selected.
def releaseFrontend = providers.gradleProperty('frontendDist')
if (releaseFrontend.isPresent()) {
    sourceSets.main.resources.exclude('static/**')
    tasks.named('processResources') {
        from(releaseFrontend.get()) { into 'static' }
        doFirst {
            if (!file("${releaseFrontend.get()}/release.json").isFile()) {
                throw new GradleException('Build the release frontend before the service')
            }
            delete(destinationDir.toPath().resolve('static').toFile())
        }
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

graalvmNative {
    binaries {
        main {
            buildArgs.add('-march=compatibility')
            buildArgs.add('--initialize-at-build-time=com.alibaba.fastjson2')
            buildArgs.add('-H:Class=com.passwordxl.PasswordXlApplication')
        }
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'cn.hutool:hutool-core:5.8.47'
    implementation 'cn.hutool:hutool-http:5.8.47'
    implementation 'cn.hutool:hutool-jwt:5.8.47'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    implementation 'com.alibaba.fastjson2:fastjson2:2.0.64'
    implementation 'io.hotmoka:toml4j:0.7.3'
}


tasks.register('printVersion') {
    doLast {
        println project.version
    }
}

tasks.named('bootJar') {
    manifest { attributes('Implementation-Version': project.version.toString()) }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
