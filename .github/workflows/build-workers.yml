name: Jenkins build worker
run-name: Jenkins ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Unique Jenkins request ID
        required: true
        type: string
      task:
        description: Worker selected by Jenkins
        required: true
        type: choice
        options: [native-arm, smoke-amd64, smoke-arm64, desktop-linux, desktop-macos, desktop-windows, android]
      payload:
        description: Pinned release context JSON (no secrets)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: ${{ inputs.task != 'native-arm' }}
    # The protected environment allows master; the first step verifies the Jenkins account.
    environment: jenkins-workers
    runs-on: ${{ fromJSON('{"native-arm":"ubuntu-24.04-arm","smoke-arm64":"ubuntu-24.04-arm","smoke-amd64":"ubuntu-24.04","desktop-linux":"ubuntu-22.04","desktop-macos":"macos-14","desktop-windows":"windows-2022","android":"ubuntu-24.04"}')[inputs.task] }}
    timeout-minutes: 115
    env: &worker_env
      WORKER_REQUEST_ID: ${{ inputs.request_id }}
      WORKER_PAYLOAD: ${{ inputs.payload }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      PYTHONUNBUFFERED: '1'
      PYTHONIOENCODING: utf-8
      YARN_ENABLE_GLOBAL_CACHE: 'false'
      YARN_CACHE_FOLDER: ${{ github.workspace }}/.ci-dependency-cache/yarn
      ELECTRON_CACHE: ${{ github.workspace }}/.ci-dependency-cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.ci-dependency-cache/electron-builder
    steps: &worker_steps
      - name: Require the Jenkins dispatch account
        shell: bash
        env:
          JENKINS_ACTOR: ${{ vars.JENKINS_ACTOR }}
        run: test -n "$JENKINS_ACTOR" && test "$GITHUB_ACTOR" = "$JENKINS_ACTOR"
      - name: Check out the pinned workflow tools
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out the pinned Gitea source
        shell: bash
        env:
          GITEA_SOURCE_URL: ${{ vars.GITEA_SOURCE_URL }}
          GITEA_TOKEN: ${{ secrets.GITEA_BUILD_READ_TOKEN }}
        run: |
          python -c 'import json,os,re,sys; sys.path.insert(0,"ci/release"); import source; p=json.loads(os.environ["WORKER_PAYLOAD"]); assert re.fullmatch("[0-9a-f]{40}",p["source_sha"]); actual=source.pin(os.environ["GITEA_SOURCE_URL"],p["source_sha"],os.environ["GITEA_TOKEN"]); assert actual==p["source_sha"]; source.git(["checkout","--detach",actual],os.environ["GITEA_TOKEN"])'
      - name: Validate dispatch identity
        shell: bash
        env:
          DISPATCH_TASK: ${{ inputs.task }}
        run: |
          python -c 'import json,os,re,subprocess; p=json.loads(os.environ["WORKER_PAYLOAD"]); assert re.fullmatch("[0-9a-f]{32}",p["request_id"]); assert p["request_id"]==os.environ["WORKER_REQUEST_ID"]; assert p["task"]==os.environ["DISPATCH_TASK"]; assert p["workflow_sha"]==os.environ["GITHUB_SHA"]; assert p["source_sha"]==subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()'
      # Dispatch on master so caches survive version tags. Checkout still uses the
      # separately pinned source SHA; both revisions are validated and recorded.
      - name: Restore reusable build dependencies
        if: ${{ !startsWith(inputs.task, 'smoke-') }}
        uses: actions/cache@v5
        with:
          path: |
            .ci-dependency-cache/
            ~/.gradle/caches/
            ~/.gradle/wrapper/
          key: deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.task }}-${{ hashFiles('password-xl-web/yarn.lock', 'password-xl-service/**/*.gradle', 'password-xl-service/gradle/wrapper/gradle-wrapper.properties') }}-${{ fromJSON(inputs.payload).android_sha || 'none' }}
          restore-keys: |
            deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.task }}-
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        if: ${{ !startsWith(inputs.task, 'smoke-') }}
        with:
          node-version: '24.20.0'
      - name: Install pinned Yarn
        if: ${{ !startsWith(inputs.task, 'smoke-') }}
        shell: bash
        run: npm install --global --force corepack@0.34.6
      - uses: graalvm/setup-graalvm@v1
        if: ${{ inputs.task == 'native-arm' }}
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'false'
      - uses: actions/setup-java@v6
        if: ${{ inputs.task == 'android' }}
        with:
          distribution: temurin
          java-version: '17'
      - name: Linux desktop dependencies
        if: ${{ inputs.task == 'desktop-linux' }}
        run: sudo apt-get update && sudo apt-get install -y rpm squashfs-tools libarchive-tools xvfb libnss3 libgtk-3-0 libasound2
      - name: Native Linux dependencies
        if: ${{ inputs.task == 'native-arm' }}
        run: sudo apt-get update && sudo apt-get install -y build-essential zlib1g-dev
      - name: Build and verify
        if: ${{ inputs.task != 'android' }}
        env:
          REGISTRY_PRIVATE_PREFIX: ${{ vars.REGISTRY_PRIVATE_PREFIX }}
          REGISTRY_WORKER_PREFIX: ${{ vars.REGISTRY_WORKER_PREFIX }}
          REGISTRY_WORKER_ANONYMOUS: ${{ vars.REGISTRY_WORKER_ANONYMOUS }}
          REGISTRY_WORKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          REGISTRY_WORKER_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
          GH_WORKER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GITEA_URL: ${{ vars.GITEA_URL }}
          GITEA_REPO: ${{ vars.GITEA_REPO }}
          GITEA_TOKEN: ${{ secrets.GITEA_BUILD_READ_TOKEN }}
        run: python ci/release/release.py worker
      - name: Set up Android command line tools
        if: ${{ inputs.task == 'android' }}
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '11076708'
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Enable Android emulator acceleration on the GitHub runner
        if: ${{ inputs.task == 'android' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=30
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Build signed APKs and test both upgrade directions
        if: ${{ inputs.task == 'android' }}
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_URL: ${{ vars.ANDROID_URL }}
          GITEA_TOKEN: ${{ secrets.GITEA_BUILD_READ_TOKEN }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 300
          script: python ci/release/release.py worker
      - name: Return this request's artifacts to Jenkins
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: worker-${{ inputs.request_id }}
          path: .release/worker/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  native-arm:
    if: ${{ inputs.task == 'native-arm' }}
    environment: jenkins-workers
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 115
    permissions:
      contents: read
    env: *worker_env
    steps: *worker_steps
