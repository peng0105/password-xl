apiVersion: v1
kind: Pod
spec:
  serviceAccountName: jenkins-build
  automountServiceAccountToken: false
  nodeSelector:
    kubernetes.io/arch: amd64
  securityContext:
    fsGroup: 1000
  containers:
    - name: jnlp
      image: ${CI_AGENT_IMAGE}
    - name: tools
      image: ${CI_TOOLS_IMAGE}
      command: [sleep]
      args: [infinity]
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      env:
        - name: PYTHONUNBUFFERED
          value: '1'
        - name: RELEASE_CACHE_ROOT
          value: /ci-cache/gradle/password-xl-artifacts-v1
        - name: YARN_CACHE_FOLDER
          value: /ci-cache/gradle/password-xl-yarn-v1
        - name: YARN_ENABLE_GLOBAL_CACHE
          value: 'false'
      volumeMounts:
        - name: release-cache
          mountPath: /ci-cache/gradle
      resources:
        requests: {cpu: '250m', memory: 512Mi}
        limits: {cpu: '2', memory: 4Gi}
  volumes:
    - name: release-cache
      persistentVolumeClaim:
        claimName: ${CI_GRADLE_CACHE_CLAIM}
